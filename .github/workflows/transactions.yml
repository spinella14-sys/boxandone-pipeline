name: hourly transactions

# Transactions and rosters every hour, at :37 — off the top of the hour,
# which is when GitHub's scheduler is busiest and delays the most.
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

# Shared with the nightly job: GitHub queues one behind the other instead of
# letting two runs pull and push the database at the same time.
concurrency:
  group: boxandone-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lay out the working directory
        run: |
          mkdir -p ~/boxandone/data ~/boxandone/raw
          cp *.py ~/boxandone/ 2>/dev/null || true

      - name: Write credentials file
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          umask 077
          for k in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL \
                   R2_BUCKET_NAME SUPABASE_URL SUPABASE_ANON_KEY \
                   SUPABASE_SERVICE_ROLE_KEY; do
            echo "$k=${!k}"
          done > ~/boxandone/.env

      - name: Run
        env:
          BOXANDONE_HOME: /home/runner/boxandone
        run: python ~/boxandone/hourly.py
